name: Amigo invisible - limpieza de sorteos vencidos

# Borra los sorteos de amigo invisible cuya fecha de intercambio ya pasó
# (minimización de datos: no guardamos nombres+emails más de lo necesario).
# El endpoint es idempotente. Corre todos los días a las 23:59 ART (02:59 UTC),
# y además el cron de nurturing (cada 2h) lo repite como red de seguridad por
# si Render estaba en cold start a esa hora.

on:
  schedule:
    - cron: '59 2 * * *'    # 23:59 ART (UTC-3) = 02:59 UTC
  workflow_dispatch:

jobs:
  limpieza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruir config/.env desde el secret
        run: printf '%s' "${{ secrets.ENV_FILE }}" > config/.env

      - name: Disparar limpieza de sorteos vencidos
        run: |
          # El secret ENV_FILE no define API_URL: sin este fallback la variable
          # quedaba vacia, curl recibia una URL relativa y fallaba en milisegundos
          # — el "|| echo" lo tapaba y el workflow quedaba verde sin hacer nada.
          API_URL=$(grep '^API_URL=' config/.env | cut -d= -f2- || true)
          API_URL=${API_URL:-https://el-gadget-tienda.onrender.com}
          ADMIN_PWD=$(grep '^ADMIN_PASSWORD=' config/.env | cut -d= -f2-)

          # Render free duerme: se lo despierta antes de la llamada real.
          curl -s --max-time 90 "$API_URL/" > /dev/null || true

          echo "Llamando a $API_URL/api/admin/amigo-invisible/limpiar ..."
          for intento in 1 2 3; do
            if curl -sf --max-time 120 -X POST "$API_URL/api/admin/amigo-invisible/limpiar" -H "X-Admin-Password: $ADMIN_PWD" -H "Content-Type: application/json"; then
              echo "Limpieza ejecutada (intento $intento)."
              exit 0
            fi
            echo "Intento $intento sin respuesta; reintento en 30s..."
            sleep 30
          done
          echo "::warning::Limpieza no respondio tras 3 intentos — nurturing la repite ($API_URL)."
